<meta charset="utf-8">
<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: julisteyläosa, suodattimet ja lista ryhmiteltynä otsikoilla (Python on jo järjestänyt ja tagannut rivit). */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --fg: #16202b;
  --muted: #5b6875;
  --line: #d9e0e6;
  --accent: #b93a0e;
  --tag-fg: #8f2c0a; /* pienet tunnisteet sävytetyllä pohjalla, vähintään 4.5:1 */
  --chip: #e6edf3;
  --field-line: #7f8b99; /* kenttien ja painikkeiden reunat, vähintään 3:1 taustoja vasten */
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Source Sans 3", -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151b; --surface: #161e26; --fg: #e4eaf0; --muted: #94a3b1; --line: #26313c;
    --accent: #ff7a45; --tag-fg: #ff7a45; --chip: #1f2a35; --field-line: #5f6d7b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151b; --surface: #161e26; --fg: #e4eaf0; --muted: #94a3b1; --line: #26313c;
  --accent: #ff7a45; --tag-fg: #ff7a45; --chip: #1f2a35; --field-line: #5f6d7b;
  color-scheme: dark;
}
/* Selaimen omat pinnat (valinta, kursori, valintaruudut) samasta paletista. */
:root { accent-color: var(--accent); }
::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); color: var(--fg); }
input { caret-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.wrap { max-width: 920px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
/* Julisteyläosa: kaupunki täydellä voimalla, päivät korostusvärillä, paksu painoviiva alla. */
header { display: grid; gap: 10px; padding-bottom: 16px; border-bottom: 6px solid var(--fg); container-type: inline-size; }
h1 { font-family: var(--display); font-weight: 700; margin: 0; text-transform: uppercase; display: grid; }
h1 .t1 { font-size: clamp(1.3rem, 3vw, 1.7rem); font-weight: 500; letter-spacing: .14em; line-height: 1; }
/* Kaupunki mitoitetaan kirjainmäärän mukaan yhdelle riville (versaali-Barlow ~0.5em/merkki). */
h1 .t2 { font-size: clamp(2rem, calc(100cqi / (var(--chars, 10) * .52)), 6rem); line-height: .86; letter-spacing: -.01em; white-space: nowrap; }
.range { font-family: var(--display); font-weight: 700; font-size: clamp(1.5rem, 4.4vw, 2.3rem); line-height: 1; color: var(--accent); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.meta { color: var(--muted); font-size: .92rem; margin: 0; }

.filters { margin: 0; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .check { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.field input, .field select { font: inherit; font-size: 1rem; color: var(--fg); background: var(--bg); border: 1px solid var(--field-line); border-radius: 6px; padding: 7px 9px; min-width: 0; }
#q { width: 18rem; max-width: 100%; }
#venue { max-width: 18rem; }
.check { display: flex; gap: 8px; align-items: center; min-height: 44px; cursor: pointer; }
.check input { width: 1.25rem; height: 1.25rem; margin: 0; }
.field input::placeholder { color: var(--muted); opacity: 1; }
.check[hidden] { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.reset[hidden] { display: none; }
.reset { font: inherit; font-size: .9rem; font-weight: 600; color: var(--accent); background: none; border: 1px solid var(--field-line); border-radius: 6px; padding: 7px 12px; min-height: 40px; cursor: pointer; }
.count { font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
/* Laskuri kuuluu listaan: lähempänä listaa kuin suodattimia, ja korkeus varattu ettei lista hyppää painikkeen ilmestyessä. */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; margin-block: -8px -12px; }
.list { display: grid; }
.group { font-family: var(--display); font-weight: 700; font-size: 1.15rem; text-transform: uppercase; letter-spacing: .08em; margin: 0; padding: 40px 0 10px; border-bottom: 3px solid var(--fg); }
.group:first-child { padding-top: 0; }
/* Ruoste kuuluu ajalle: otsikon päivät, päättyvät näyttelyt ja niiden ryhmä. */
.group.pian { border-bottom-color: var(--accent); }
.card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 14px 0; border-top: 1px solid var(--line); }
.group + .card { border-top: 0; }
.name { font-weight: 600; font-size: 1.1rem; line-height: 1.3; margin: 0; overflow-wrap: anywhere; }
.where, .hours { color: var(--muted); font-size: .92rem; overflow-wrap: anywhere; }
.unknown { color: var(--muted); font-size: .92rem; font-style: italic; }
.when { font-family: var(--display); font-weight: 700; font-size: 1.3rem; letter-spacing: .03em; font-variant-numeric: tabular-nums; }
.price { font-variant-numeric: tabular-nums; font-weight: 600; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.pill { font-size: .74rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.pill.pian { color: var(--tag-fg); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.pill.avautuu { color: var(--fg); background: transparent; box-shadow: inset 0 0 0 1px var(--field-line); }
.right { display: grid; justify-items: end; align-content: start; gap: 4px; text-align: right; }
/* Täyte kasvattaa osuma-alueen 44 px:iin muuttamatta ulkoasua. */
.link { color: var(--fg); font-weight: 600; font-size: .92rem; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; display: inline-block; padding: 12px 8px; margin: -12px -8px; }
.link:hover { color: var(--accent); }
.note { font-size: .85rem; color: var(--muted); max-width: 70ch; }
.note.warn { color: var(--fg); font-weight: 600; }
.empty { color: var(--muted); padding: 24px 0; border-top: 3px solid var(--fg); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.empty p { flex: 1 1 100%; margin: 0; }
footer { color: var(--muted); font-size: .88rem; display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 14px; }
footer p { margin: 0; max-width: 70ch; text-wrap: pretty; }
footer a { color: var(--accent); text-underline-offset: 2px; }

@media (max-width: 560px) {
  .card { grid-template-columns: 1fr; }
  .right { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; text-align: left; }
  .reset, .field input, .field select { min-height: 44px; }
  #q { width: 100%; }
  .filters { padding: 12px; gap: 8px 14px; }
  .filters .field { flex: 1 1 100%; }
  #venue { max-width: none; }
  header { padding-bottom: 12px; }
}
</style>

<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <div class="range" id="range"></div>
    <p class="meta" id="generated"></p>
  </header>

  <form class="filters" id="filters" autocomplete="off">
    <div class="field">
      <label for="q">Haku</label>
      <input id="q" type="search" placeholder="näyttely, paikka tai taiteilija">
    </div>
    <div class="field">
      <label for="venue">Paikka</label>
      <select id="venue"><option value="">Kaikki paikat</option></select>
    </div>
    <label class="check" for="free"><input id="free" type="checkbox"> Vain ilmaiset</label>
    <label class="check" for="fresh"><input id="fresh" type="checkbox"> Vain uudet</label>
  </form>

  <div class="bar">
    <div class="count" id="count"></div>
    <div class="sr-only" id="count-live" aria-live="polite"></div>
    <button class="reset" id="clear" type="button" hidden>Tyhjennä suodattimet</button>
  </div>

  <main class="list" id="list"></main>

  <footer id="footer"></footer>
</div>

<script type="application/json" id="data">__DATA__</script>
<script>
(function () {
  document.documentElement.lang = "fi";
  const data = JSON.parse(document.getElementById("data").textContent);
  const rows = (data.exhibitions || []).filter((e) => e && e.name && e.venue);
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const isFree = (e) => /^\s*(ilmai|vapaa pääsy)/i.test(e.price || "");
  const isNew = (e) => (e.tags || []).includes("Uusi");
  const WD = ["su", "ma", "ti", "ke", "to", "pe", "la"];
  const day = (iso) => { const d = new Date(iso + "T12:00:00"); return WD[d.getDay()] + " " + d.getDate() + "." + (d.getMonth() + 1) + "."; };
  const GROUPS = [["Uusi", "Uutta tällä viikolla"], ["Päättyy pian", "Viimeiset päivät", "pian"], ["Pysyvä", "Pysyvät"]];
  // Ryhmä on rivin ensimmäinen tunniste samassa järjestyksessä kuin sivu.py:n sort_key.
  const group = (e) => (GROUPS.find(([t]) => (e.tags || []).includes(t)) || [null, "Esillä koko viikon"]);
  const plural = (n, one, many) => n + " " + (n === 1 ? one : many);
  for (const e of rows) e._hay = [e.name, e.venue, e.hours, e.note].join(" ").toLowerCase();

  // "Näyttelyt Oulussa" -> pieni "Näyttelyt" ja kaupunki julisteen kokoisena.
  const title = (data.title || "Näyttelyt").trim();
  const m = title.match(/^(näyttelyt)\s+(.+)$/i);
  const city = el("span", "t2", m ? m[2] : title);
  city.style.setProperty("--chars", [...city.textContent].length);
  if (m) $("title").append(el("span", "t1", m[1]));
  $("title").append(city);
  $("range").textContent = data.range || "";
  const g = (data.generated || "").split("-");
  $("generated").textContent = g.length === 3 ? "Tiedot haettu " + +g[2] + "." + +g[1] + "." + g[0] : "";

  const venues = [...new Set(rows.map((e) => e.venue))].sort((a, b) => a.localeCompare(b, "fi"));
  for (const v of venues) { const o = el("option", null, v); o.value = v; $("venue").append(o); }

  let announce;
  function render() {
    const words = $("q").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const venue = $("venue").value, free = $("free").checked, fresh = $("fresh").checked;
    const shown = rows.filter((e) => (!venue || e.venue === venue) && (!free || isFree(e)) && (!fresh || isNew(e)) && words.every((w) => e._hay.includes(w)));
    const filtered = Boolean(words.length || venue || free || fresh);
    $("clear").hidden = !filtered;
    const total = filtered ? shown.length + " / " + plural(rows.length, "näyttely", "näyttelyä") : "Kaikki " + plural(rows.length, "näyttely", "näyttelyä");
    $("count").textContent = total;
    // Ruudunlukijalle tulos vasta kun kirjoittaminen taukoaa.
    clearTimeout(announce);
    announce = setTimeout(() => { $("count-live").textContent = total; }, 400);

    const list = $("list");
    list.replaceChildren();
    if (!shown.length) {
      const box = el("div", "empty");
      // Tyhjennyspainike on jo laskurin vieressä, joten tähän vain selitys.
      box.append(el("p", null, rows.length ? "Mikään näyttely ei vastaa suodattimia. Kokeile toista hakusanaa tai tyhjennä suodattimet." : "Tältä aikaväliltä ei löytynyt näyttelyitä."));
      list.append(box);
      return;
    }
    let current;
    shown.forEach((e, i) => {
      const [tag, heading, cls] = group(e);
      if (heading !== current) { list.append(el("h2", "group" + (cls ? " " + cls : ""), heading)); current = heading; }
      const c = el("article", "card");
      c.setAttribute("aria-labelledby", "n" + i);
      const left = el("div");
      // Ryhmän otsikko kertoo tunnisteen; kortissa vain päivät (avautuu, päättyy).
      const pills = [];
      if (e.start && e.start > data.generated) pills.push(["avautuu", "Avautuu " + day(e.start)]);
      if ((e.tags || []).includes("Päättyy pian")) pills.push(["pian", e.end === data.generated ? "Päättyy tänään" : "Päättyy " + day(e.end)]);
      if (pills.length) {
        const t = el("div", "tags");
        for (const [cls, text] of pills) t.append(el("span", "pill " + cls, text));
        left.append(t);
      }
      const name = el("h3", "name", e.name); name.id = "n" + i;
      left.append(name, el("div", "where", e.venue));
      const known = (v) => v && v !== "–";
      left.append(known(e.hours) ? el("div", "hours", e.hours) : el("div", "unknown", e.url ? "Aukioloajat: katso lisätiedot" : "Aukioloajat: ei tiedossa"));
      if (e.note) left.append(el("div", "note" + (/^poikkeus/i.test(e.note) ? " warn" : ""), e.note));
      const right = el("div", "right");
      if (e.dates) right.append(el("div", "when", e.dates));
      if (known(e.price)) right.append(el("span", "price", e.price));
      else right.append(el("span", "unknown", "Hinta: ei tiedossa"));
      if (e.url) {
        const a = el("a", "link", "Lisätiedot");
        a.href = e.url; a.target = "_blank"; a.rel = "noopener";
        a.setAttribute("aria-label", "Lisätiedot: " + e.name + ", " + e.venue + " (avautuu uuteen välilehteen)");
        right.append(a);
      }
      c.append(left, right);
      list.append(c);
    });
  }

  const f = $("footer");
  for (const n of data.notes || []) f.append(el("p", null, n));
  if ((data.sources || []).length) {
    const p = el("p", null, "Lähteet: ");
    data.sources.forEach((s, i) => {
      if (i) p.append(", ");
      if (s.url) { const a = el("a", null, s.name); a.href = s.url; a.target = "_blank"; a.rel = "noopener"; p.append(a); }
      else p.append(s.name);
    });
    f.append(p);
  }

  function resetFilters() { $("filters").reset(); render(); $("q").focus(); }
  $("clear").addEventListener("click", resetFilters);
  $("filters").addEventListener("submit", (ev) => ev.preventDefault());
  for (const id of ["q", "venue", "free", "fresh"]) $(id).addEventListener("input", render);
  render();
})();
</script>
