<style>
/* Layout: julisteyläosa, suodattimet, kiinteä suunnistuspalkki ja päivittäin ryhmitelty lista (päiväleima vasemmalla, keikat oikealla). */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --fg: #16202b;
  --muted: #5b6875;
  --line: #d9e0e6;
  --accent: #b93a0e;
  --sold: #9f1239;
  --low: #734a00;
  --free: #1f6b3a;
  --chip: #e6edf3;
  --field-line: #7f8b99; /* kenttien ja painikkeiden reunat, vähintään 3:1 taustoja vasten */
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Source Sans 3", -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151b; --surface: #161e26; --fg: #e4eaf0; --muted: #94a3b1; --line: #26313c;
    --accent: #ff7a45; --sold: #ff8fab; --low: #f0b54a; --free: #6fcf8f; --chip: #1f2a35; --field-line: #5f6d7b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151b; --surface: #161e26; --fg: #e4eaf0; --muted: #94a3b1; --line: #26313c;
  --accent: #ff7a45; --sold: #ff8fab; --low: #f0b54a; --free: #6fcf8f; --chip: #1f2a35; --field-line: #5f6d7b;
  color-scheme: dark;
}
/* Selaimen omat pinnat (valinta, kursori, valintaruudut) samasta paletista. */
:root { accent-color: var(--accent); }
::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); color: var(--fg); }
input { caret-color: var(--accent); }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.wrap { max-width: 920px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
/* Julisteyläosa: kaupunki täydellä voimalla, päivät korostusvärillä, paksu painoviiva alla. */
header { display: grid; gap: 10px; padding-bottom: 16px; border-bottom: 6px solid var(--fg); container-type: inline-size; }
h1 { font-family: var(--display); font-weight: 700; margin: 0; text-transform: uppercase; display: grid; }
h1 .t1 { font-size: clamp(1.3rem, 3vw, 1.7rem); font-weight: 500; letter-spacing: .14em; line-height: 1; }
/* Kaupunki mitoitetaan kirjainmäärän mukaan yhdelle riville (versaali-Barlow ~0.5em/merkki). */
h1 .t2 { font-size: clamp(2rem, calc(100cqi / (var(--chars, 10) * .52)), 6rem); line-height: .86; letter-spacing: -.01em; white-space: nowrap; }
.range { font-family: var(--display); font-weight: 700; font-size: clamp(1.5rem, 4.4vw, 2.3rem); line-height: 1; color: var(--accent); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.meta { color: var(--muted); font-size: .92rem; margin: 0; }

.filters { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .check { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.field input, .field select { font: inherit; font-size: 1rem; color: var(--fg); background: var(--bg); border: 1px solid var(--field-line); border-radius: 6px; padding: 7px 9px; min-width: 0; }
#q { width: 18rem; max-width: 100%; }
#maxp { width: 6.5rem; }
#venue { max-width: 18rem; }
.check { display: flex; gap: 8px; align-items: center; min-height: 44px; cursor: pointer; }
.check input { width: 1.25rem; height: 1.25rem; margin: 0; }
.field input::placeholder { color: var(--muted); opacity: 1; }
.check[hidden] { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.count { font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.count .hidden-note { display: block; font-size: .82rem; }
.reset { font: inherit; font-size: .9rem; font-weight: 600; color: var(--accent); background: none; border: 1px solid var(--field-line); border-radius: 6px; padding: 7px 12px; min-height: 40px; cursor: pointer; }
.reset:hover { border-color: var(--accent); }
.reset[hidden] { display: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Suunnistuspalkki: pysyy ylhäällä koko listan ajan. Päiväleimat tarttuvat sen alareunaan (--rail-h). */
.rail { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px 12px; padding: 10px 0; background: var(--bg); border-bottom: 1px solid var(--line); }
.chips { display: flex; gap: 6px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { font-family: var(--display); font-weight: 700; font-size: 1rem; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; color: var(--fg); background: var(--surface); border: 1px solid var(--field-line); border-radius: 999px; padding: 6px 14px; min-height: 40px; cursor: pointer; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.weekend { color: var(--accent); }
.rail-end { display: flex; align-items: center; gap: 10px; flex: none; }
.day { display: grid; grid-template-columns: 7.5rem 1fr; gap: 0 18px; border-top: 3px solid var(--fg); padding-top: 12px; scroll-margin-top: calc(var(--rail-h, 0px) + 8px); }
h2.stamp { margin: 0; font-size: inherit; }
h2.stamp:focus { outline: none; }
h2.stamp:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
/* Päiväleima pysyy näkyvissä koko päivän keikkojen ajan. */
.stamp { font-family: var(--display); line-height: 1; min-width: 0; position: sticky; top: calc(var(--rail-h, 0px) + 12px); align-self: start; }
.stamp .wd { display: block; font-size: 1.05rem; font-weight: 700; letter-spacing: .12em; color: var(--accent); text-transform: uppercase; }
.stamp .dm { display: block; font-size: 2.7rem; font-weight: 700; line-height: .9; letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
/* Perjantai ja lauantai ovat keikkailtoja: niiden päivä painetaan korostusvärillä. */
.stamp.weekend .dm { color: var(--accent); }
.stamp .yr { display: block; font-size: 1rem; font-weight: 500; letter-spacing: .06em; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
.year-break { font-family: var(--display); font-weight: 700; font-size: 1.6rem; letter-spacing: .04em; color: var(--accent); padding-top: 8px; }
.gigs { display: grid; min-width: 0; }
.gig { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.gig:last-child { border-bottom: 0; }
.artist { font-weight: 600; font-size: 1.05rem; overflow-wrap: anywhere; }
.where { color: var(--muted); font-size: .92rem; overflow-wrap: anywhere; }
.right { display: flex; flex-wrap: wrap; justify-content: end; align-items: baseline; gap: 4px 12px; text-align: right; }
.price { font-variant-numeric: tabular-nums; font-size: 1.05rem; font-weight: 600; white-space: nowrap; }
.price.free { color: var(--free); }
.price.unknown { color: var(--muted); font-weight: 400; }
.gig.is-sold .price { color: var(--muted); font-weight: 400; }
.pill { font-size: .74rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.pill.sold { color: var(--sold); background: color-mix(in srgb, var(--sold) 14%, transparent); }
.pill.low { color: var(--low); background: color-mix(in srgb, var(--low) 16%, transparent); }
/* Täyte kasvattaa osuma-alueen 44 px:iin muuttamatta ulkoasua. */
.link { color: var(--accent); font-weight: 600; font-size: .92rem; text-decoration: none; display: inline-block; padding: 12px 8px; margin: -12px -8px; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.note { grid-column: 1 / -1; font-size: .85rem; color: var(--muted); }

.empty { color: var(--muted); padding: 24px 0; border-top: 2px solid var(--fg); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.empty p { flex: 1 1 100%; margin: 0; }
footer { color: var(--muted); font-size: .88rem; display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 14px; }
footer p { margin: 0; max-width: 70ch; }
footer a { color: var(--accent); text-underline-offset: 2px; }

@media (max-width: 560px) {
  .day { grid-template-columns: 1fr; gap: 4px; }
  .stamp { top: var(--rail-h, 0px); z-index: 1; background: var(--bg); padding: 8px 0 6px; margin-top: -8px; line-height: 1.15; }
  .rail { flex-wrap: wrap; }
  .chips { flex: 1 1 100%; order: -1; }
  .rail-end { flex: 1 1 auto; justify-content: space-between; }
  .chip, .reset, .field input, .field select { min-height: 44px; }
  .count { flex: 1 1 auto; min-width: 0; text-align: left; line-height: 1.25; }
  .count .hidden-note { white-space: nowrap; font-size: .78rem; }
  .stamp .wd, .stamp .dm, .stamp .yr { display: inline; }
  .stamp .dm { font-size: 2.1rem; margin-left: 8px; }
  .stamp .yr { margin-left: 6px; }
  .gig { grid-template-columns: 1fr; }
  .right { justify-content: start; text-align: left; }
  #q { width: 100%; }
  .filters .field:first-child { flex: 1 1 100%; }
}
</style>

<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <div class="range" id="range"></div>
    <p class="meta" id="generated"></p>
  </header>

  <form class="filters" id="filters" autocomplete="off">
    <div class="field">
      <label for="q">Haku</label>
      <input id="q" type="search" placeholder="artisti, paikka, 14.11. tai joulukuu">
    </div>
    <div class="field">
      <label for="venue">Paikka</label>
      <select id="venue"><option value="">Kaikki paikat</option></select>
    </div>
    <div class="field">
      <label for="maxp">Hinta enintään (€)</label>
      <input id="maxp" type="number" min="0" step="1" inputmode="numeric" placeholder="ei rajaa">

    <label class="check" for="unpriced" hidden><input id="unpriced" type="checkbox"> Näytä myös ilman hintaa</label>

      <div class="count" id="count"></div>
      <div class="sr-only" id="count-live" aria-live="polite"></div>
      <button class="reset" id="clear" type="button" hidden>Tyhjennä</button>
      <button class="reset" id="totop" type="button">Suodattimet</button>
    </div>
  </nav>

  <main id="list"></main>

  <footer id="footer"></footer>
</div>

<script type="application/json" id="data">__DATA__</script>
<script>
(function () {
  document.documentElement.lang = "fi";
  const data = JSON.parse(document.getElementById("data").textContent);
  // Rivi ilman kelvollista päivää rikkoisi ryhmittelyn; sivu.py tarkistaa saman, tämä on varmistus.
  const ISO = /^\d{4}-\d{2}-\d{2}$/;
  data.events = (data.events || []).filter((e) => e && ISO.test(e.date || "") && e.artist);
  for (const e of data.events) if (e.end && !ISO.test(e.end)) delete e.end;
  const WD = ["su", "ma", "ti", "ke", "to", "pe", "la"];
  const WD_LONG = ["sunnuntai", "maanantai", "tiistai", "keskiviikko", "torstai", "perjantai", "lauantai"];
  const MONTHS = ["tammikuu", "helmikuu", "maaliskuu", "huhtikuu", "toukokuu", "kesäkuu", "heinäkuu", "elokuu", "syyskuu", "lokakuu", "marraskuu", "joulukuu"];
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const thisYear = new Date().getFullYear();

  function parts(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    const dt = new Date(y, m - 1, d);
    return { wd: WD[dt.getDay()], dm: d + "." + m + ".", yr: y !== thisYear ? String(y) : "", full: d + "." + m + "." + (y !== thisYear ? y : "") };
  }

  // Päivähaku: "14.11.", "14.11", "14.11.2026" ja "2026-11-14" osuvat myös monipäiväisen tapahtuman sisälle.
  function dateQuery(q) {
    let m = q.match(/^(\d{1,2})\.(\d{1,2})\.?(\d{4})?$/);
    if (m) return { d: +m[1], m: +m[2], y: m[3] ? +m[3] : null };
    m = q.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (m) return { d: +m[3], m: +m[2], y: +m[1] };
    return null;
  }
  function covers(e, dq) {
    const start = e.date, end = e.end || e.date;
    const years = dq.y ? [dq.y] : [...new Set([+start.slice(0, 4), +end.slice(0, 4)])];
    return years.some((y) => {
      const iso = y + "-" + String(dq.m).padStart(2, "0") + "-" + String(dq.d).padStart(2, "0");
      return start <= iso && iso <= end;
    });
  }
  // Tekstihakuun mukaan päivän eri kirjoitusasut, viikonpäivä ja kuukauden nimi.
  function haystack(e) {
    const [y, m, d] = e.date.split("-").map(Number);
    const dt = new Date(y, m - 1, d);
    return [e.artist, e.venue, e.date, d + "." + m + ".", d + "." + m + "." + y,
            WD[dt.getDay()], WD_LONG[dt.getDay()], MONTHS[m - 1], String(y)].join(" ").toLowerCase();
  }
  for (const e of data.events) e._hay = haystack(e);
  // Hintatekstin luvut: "12,50-6,50 €" -> [12.5, 6.5]. Ikärajat, kellonajat ja päivät
  // ("alle 12-vuotiaat", "klo 19", "14.11.") eivät ole hintoja.
  const isFree = (e) => e.status === "ilmainen" || /^\s*(ilmai|vapaa pääsy)/i.test(e.price || "");
  function priceNums(text) {
    const cleaned = text
      .replace(/\b(alle|yli)\s+\d+(-v\S*|\s*v\.?)?/gi, " ")
      .replace(/\d+\s*-?\s*v(uotia\S*|\.)/gi, " ")
      .replace(/klo\s*\d+([.:]\d+)?/gi, " ")
      .replace(/\d{1,2}\.\d{1,2}\.(\d{4})?/g, " ");
    return (cleaned.match(/\d+(?:[.,]\d+)?/g) || []).map((n) => parseFloat(n.replace(",", ".")));
  }
  // Alin hinta vertailua varten: "35 / 20€" -> 20, "Ilmainen" -> 0, "–" -> null.
  function minPrice(e) {
    if (isFree(e)) return 0;
    const nums = priceNums(e.price || "");
    return nums.length ? Math.min(...nums) : null;
  }
  for (const e of data.events) e._min = minPrice(e);
  // Taulukon hinta lyhyeksi: "35 / 20€ (alempi hinta koskee …)" -> "20–35 €", "alk. 15€" -> "alk. 15 €".
  // Alkuperäinen teksti jää vihjeeksi (title), kun lyhennys jättää jotain pois.
  const euro = (n) => (Number.isInteger(n) ? String(n) : n.toFixed(2).replace(".", ",")) + " €";
  function shortPrice(e) {
    const text = (e.price || "").trim();
    if (isFree(e)) return { text: "Ilmainen", cls: "free" };
    const nums = [...new Set(priceNums(text))].sort((a, b) => a - b);
    if (!nums.length) {
      // "Loppuunmyyty" hinnan paikalla toistaisi tilan; muu sanallinen hinta ("Ei vielä myynnissä") näytetään.
      if (!text || text === "–" || text.toLowerCase() === e.status || /loppuunmyyty|sold\s*out/i.test(text)) return { text: "–", cls: "unknown", title: "Hinta ei tiedossa" };
      return { text, cls: "" };
    }
    const lo = nums[0], hi = nums[nums.length - 1];
    const short = /\balk\./i.test(text) ? "alk. " + euro(lo)
      : lo === hi ? euro(lo)
      : euro(lo).replace(" €", "") + "–" + euro(hi);
    return { text: short, cls: "", title: short.replace(/\s/g, "") === text.replace(/\s/g, "") ? "" : text };
  }
  const plural = (n, one, many) => n + " " + (n === 1 ? one : many);
  // Pilleri vain poikkeuksille; saatavilla on oletus ja ilmainen näkyy jo hinnassa.
  const pillClass = { "loppuunmyyty": "sold", "peruttu": "sold", "vähissä": "low", "ei vielä myynnissä": "" };

  // "Keikat Helsingissä" -> pieni "Keikat" ja kaupunki julisteen kokoisena.
  const title = (data.title || "Keikat").trim();
  const m = title.match(/^(keikat)\s+(.+)$/i);
  const city = el("span", "t2", m ? m[2] : title);
  city.style.setProperty("--chars", [...city.textContent].length);
  if (m) $("title").append(el("span", "t1", m[1]));
  $("title").append(city);
  $("range").textContent = data.range || "";
  $("generated").textContent = data.generated ? "Tiedot haettu " + data.generated : "";

  const venues = [...new Set(data.events.map((e) => e.venue).filter(Boolean))].sort((a, b) => a.localeCompare(b, "fi"));
  for (const v of venues) { const o = el("option", null, v); o.value = v; $("venue").append(o); }

  // "Liput", kun linkki vie lipunmyyjän tapahtumasivulle; muuten (paikan sivu, myyjän etusivu) "Lisätiedot".
  const TICKET_HOSTS = /(^|\.)(tiketti\.fi|ticketmaster\.fi|lippu\.fi|eventim\.fi|fienta\.com|liveto\.io|lippupiste\.fi|holvi\.com|cluby\.com|seat4\.me|tickettailor\.com|eventual\.fi|tmtickets\.fi|jelmu\.net|biletti\.fi)$/i;
  function linkKind(url) {
    try {
      const u = new URL(url);
      return TICKET_HOSTS.test(u.hostname) && u.pathname.replace(/\/+$/, "") !== "" ? "Liput" : "Lisätiedot";
    } catch (err) { return "Lisätiedot"; }
  }

  // Pikavalinnat: tänään, lähin viikonloppu ja viikot (yli 8 viikon välillä kuukaudet).
  function isoWeek(dt) {
    const d = new Date(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()));
    const day = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - day);
    const start = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return Math.ceil(((d - start) / 864e5 + 1) / 7);
  }
  const localIso = (dt) => dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0");
  function jumpTo(date) {
    const day = document.getElementById("d-" + date);
    if (!day) return;
    day.scrollIntoView({ block: "start" });
    day.querySelector(".stamp").focus({ preventScroll: true });
  }
  function renderChips(dates) {
    const chips = [];
    const today = localIso(new Date());
    if (dates.includes(today)) chips.push({ label: "Tänään", date: today });
    const wk = dates.find((d) => [5, 6, 0].includes(new Date(d + "T12:00").getDay()));
    if (wk && wk !== today) chips.push({ label: "Viikonloppu", date: wk, weekend: true });
    const groups = new Map();
    const weeks = new Set(dates.map((d) => isoWeek(new Date(d + "T12:00")) + "/" + d.slice(0, 4)));
    const byMonth = weeks.size > 8;
    for (const d of dates) {
      const dt = new Date(d + "T12:00");
      const key = byMonth ? d.slice(0, 7) : d.slice(0, 4) + "-w" + isoWeek(dt);
      if (!groups.has(key)) groups.set(key, { label: byMonth ? MONTHS[dt.getMonth()] : "vk " + isoWeek(dt), date: d, first: d, last: d });
      groups.get(key).last = d;
    }
    // Ruudunlukijalle koko kohde: "Siirry viikkoon 47, 16.–22.11." / "Siirry kuukauteen joulukuu".
    for (const g of groups.values()) {
      const a = parts(g.first), b = parts(g.last);
      g.aria = byMonth ? "Siirry kuukauteen " + g.label : "Siirry viikkoon " + g.label.slice(3) + ", " + (g.first === g.last ? a.full : a.dm.replace(/\.\d+\.$/, ".") + "–" + b.full);
    }
    chips.push(...groups.values());
    $("chips").replaceChildren(...chips.map((c) => {
      const b = el("button", "chip" + (c.weekend ? " weekend" : ""), c.label);
      b.type = "button";
      if (c.aria) b.setAttribute("aria-label", c.aria);
      b.addEventListener("click", () => jumpTo(c.date));
      return b;
    }));
  }

  let announce;
  function render() {
    const q = $("q").value.trim().toLowerCase();
    const venue = $("venue").value;
    const raw = $("maxp").value.trim();
    const maxp = raw === "" || !Number.isFinite(Number(raw)) ? null : Math.max(0, Number(raw));
    const showUnpriced = $("unpriced").checked;
    const hideSold = $("hidesold").checked;
    $("unpriced").closest(".check").hidden = maxp == null;
    let unpricedHidden = 0;
    const dq = dateQuery(q);
    const words = q.split(/\s+/).filter(Boolean);
    const rows = data.events.filter((e) => {
      if (venue && e.venue !== venue) return false;
      if (hideSold && e.status === "loppuunmyyty") return false;
      if (dq ? !covers(e, dq) : !words.every((w) => e._hay.includes(w))) return false;
      if (maxp != null) {
        // Tuntematon hinta ei täytä hintarajaa, ellei käyttäjä erikseen halua nähdä myös ne.
        if (e._min == null) { if (!showUnpriced) { unpricedHidden++; return false; } }
        else if (e._min > maxp) return false;
      }
      return true;
    });
    const filtered = Boolean(q || venue || maxp != null || hideSold);
    $("clear").hidden = !filtered;

    const list = $("list");
    list.replaceChildren();
    const count = $("count");
    const total = filtered
      ? rows.length + " / " + plural(data.events.length, "keikka", "keikkaa")
      : "Kaikki " + plural(data.events.length, "keikka", "keikkaa");
    const hiddenText = unpricedHidden ? unpricedHidden + " ilman hintaa piilotettu" : "";
    count.replaceChildren(total);
    if (hiddenText) count.append(el("span", "hidden-note", hiddenText));
    // Ruudunlukijalle tulos vasta kun kirjoittaminen taukoaa, ei jokaisesta välivaiheesta.
    clearTimeout(announce);
    announce = setTimeout(() => { $("count-live").textContent = total + (hiddenText ? ", " + hiddenText : ""); }, 400);
    if (!rows.length) renderChips([]);
    if (!data.events.length) {
      const box = el("div", "empty");
      box.append(el("p", null, "Tältä aikaväliltä ei löytynyt keikkoja."));
      list.append(box);
      return;
    }
    if (!rows.length) {
      const box = el("div", "empty");
      const hint = unpricedHidden
        ? "Mikään keikka ei vastaa suodattimia. " + plural(unpricedHidden, "keikka", "keikkaa") + " on piilotettu, koska hinta ei ole tiedossa."
        : "Mikään keikka ei vastaa suodattimia.";
      const btn = el("button", "reset", "Tyhjennä suodattimet");
      btn.type = "button";
      btn.addEventListener("click", resetFilters);
      box.append(el("p", null, hint));
      if (unpricedHidden) {
        const show = el("button", "reset", "Näytä myös ilman hintaa (" + unpricedHidden + ")");
        show.type = "button";
        show.addEventListener("click", () => { $("unpriced").checked = true; render(); });
        box.append(show);
      }
      box.append(btn);
      list.append(box);
      return;
    }

    const byDay = new Map();
    for (const e of rows) { if (!byDay.has(e.date)) byDay.set(e.date, []); byDay.get(e.date).push(e); }
    renderChips([...byDay.keys()]);
    const frag = document.createDocumentFragment();
    let lastYear = thisYear;
    for (const [date, gigs] of byDay) {
      const p = parts(date);
      const y = +date.slice(0, 4);
      if (y !== lastYear) { frag.append(el("div", "year-break", String(y))); lastYear = y; }
      const day = el("section", "day");
      const stamp = el("h2", "stamp" + (p.wd === "pe" || p.wd === "la" ? " weekend" : ""));
      day.id = "d-" + date;
      stamp.tabIndex = -1;
      stamp.append(el("span", "wd", p.wd), el("span", "dm", p.dm));
      if (p.yr) stamp.append(el("span", "yr", p.yr));
      const box = el("div", "gigs");
      for (const e of gigs) {
        const g = el("article", "gig" + (e.status === "loppuunmyyty" ? " is-sold" : ""));
        const left = el("div");
        left.append(el("div", "artist", e.artist));
        let where = e.venue || "";
        if (e.end) { const pe = parts(e.end); where += (where ? " · " : "") + "jatkuu " + pe.wd + " " + pe.full; }
        if (e.time) where += (where ? " · " : "") + e.time;
        left.append(el("div", "where", where));
        const right = el("div", "right");
        const sp = shortPrice(e);
        const price = el("span", "price" + (sp.cls ? " " + sp.cls : ""), sp.text);
        if (sp.cls === "unknown") { price.setAttribute("aria-hidden", "true"); }
        if (sp.title) price.title = sp.title;
        const hasPill = e.status in pillClass;
        if (hasPill) right.append(el("span", "pill " + pillClass[e.status], e.status));
        // Pillerin vieressä tuntematon hinta "–" on pelkkää kohinaa.
        if (!(hasPill && sp.cls === "unknown")) right.append(price);
        if (sp.cls === "unknown") right.append(el("span", "sr-only", "hinta ei tiedossa"));
        if (e.url) {
          const kind = linkKind(e.url);
          const a = el("a", "link", kind);
          a.href = e.url; a.target = "_blank"; a.rel = "noopener";
          a.setAttribute("aria-label", kind + ": " + e.artist + ", " + (e.venue ? e.venue + " " : "") + p.full + " (avautuu uuteen välilehteen)");
          right.append(a);
        }
        g.append(left, right);
        if (e.note) g.append(el("div", "note", e.note));
        box.append(g);
      }
      day.append(stamp, box);
      frag.append(day);
    }
    list.append(frag);
  }

  const f = $("footer");
  for (const n of data.notes || []) f.append(el("p", null, n));
  if ((data.sources || []).length) {
    const p = el("p", null, "Lähteet: ");
    data.sources.forEach((s, i) => {
      if (i) p.append(", ");
      if (s.url) { const a = el("a", null, s.name); a.href = s.url; a.target = "_blank"; a.rel = "noopener"; p.append(a); }
      else p.append(s.name);
    });
    f.append(p);
  }

  function resetFilters() {
    $("filters").reset();
    render();
    $("q").focus();
  }
  $("clear").addEventListener("click", resetFilters);
  $("totop").addEventListener("click", () => {
    $("filters").scrollIntoView({ block: "start" });
    $("q").focus({ preventScroll: true });
  });
  // Palkin korkeus vaihtelee (rivitys mobiilissa), joten päiväleimojen tarttumakohta seuraa sitä.
  const setRail = () => document.documentElement.style.setProperty("--rail-h", $("rail").offsetHeight + "px");
  if ("ResizeObserver" in window) new ResizeObserver(setRail).observe($("rail"));
  setRail();
  $("filters").addEventListener("submit", (ev) => ev.preventDefault());
  for (const id of ["q", "venue", "maxp", "unpriced", "hidesold"]) $(id).addEventListener("input", render);
  render();
})();
</script>
